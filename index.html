<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OVERKILL</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<main>
<header>
<h1>OVERKILL</h1>
<div class="opts">
<button id="mode" type="button" aria-label="Alternar modo angular">DEG</button>
<select id="prec" aria-label="Precisão em dígitos significativos">
<option value="8">8 dígitos</option>
<option value="12">12 dígitos</option>
<option value="15">15 dígitos</option>
</select>
</div>
</header>
<nav class="tabs" aria-label="Módulos">
<button type="button" data-tab="calc" aria-pressed="true">Calculadora</button>
<button type="button" data-tab="mat" aria-pressed="false">Matrizes</button>
</nav>
<div id="calcview">
<section class="screen" aria-live="polite">
<input id="expr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Expressão" placeholder="2sin(30)+√16">
<div id="prev"></div>
<div id="res" title="Toque para copiar" role="button" tabindex="0"></div>
<div id="err" role="alert"></div>
<div id="info"></div>
</section>
<div class="pad" id="pad"></div>
<details>
<summary>Histórico</summary>
<ul id="hist"></ul>
<button class="clr" id="clr" type="button">Limpar histórico</button>
</details>
<details>
<summary>Variáveis e fórmulas</summary>
<p class="hint">Ex.: x=5 · f(x)=x^2-2 · solve(f,1) · solve(f,0,2)</p>
<ul id="vars"></ul>
</details>
</div>
<section id="mat" hidden>
<div class="screen">
<label for="matA">Matriz A (linhas separadas por ;)</label>
<textarea id="matA" rows="3" spellcheck="false">2 1; 1 3</textarea>
<label for="matB">Matriz B ou vetor b</label>
<textarea id="matB" rows="2" spellcheck="false">3; 5</textarea>
<div class="row">
<select id="matOp" aria-label="Operação">
<option value="solve">Resolver Ax = b</option>
<option value="det">Determinante</option>
<option value="inv">Inversa</option>
<option value="T">Transposta</option>
<option value="rank">Posto</option>
<option value="mul">A × B</option>
</select>
<button id="matGo" type="button">Calcular</button>
</div>
<pre id="matOut" aria-live="polite"></pre>
</div>
</section>
</main>
<script src="src/engine.js"></script>
<script src="src/matrix.js"></script>
</body>
</html>
